apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argocdproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:Ilbertii/infra.git
    targetRevision: main
    path: applications # Директория с дочерними манифестами Application

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd # Application будут создаваться в неймспейсе argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true